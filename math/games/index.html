<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Graphwar web prototype — GraphPlane</title>
    <style>
      body {
        background: #1b1f24;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px;
      }
      canvas {
        background: #ffffff;
        border: 1px solid #444;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        max-width: 770px;
      }
      #func-label {
        font-family: monospace;
        font-size: 14px;
      }
      #function-input {
        flex: 1;
        min-width: 200px;
        font-family: monospace;
        font-size: 14px;
        padding: 6px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #status {
        min-height: 1.2em;
        max-width: 770px;
      }
      #status.error {
        color: #ff6b6b;
      }
      .angle-controls {
        display: none;
        gap: 4px;
        align-items: center;
      }
      .angle-controls.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <h1 style="margin: 0; font-size: 1.1rem">Graphwar web prototype — GraphPlane</h1>

    <canvas id="plane" width="770" height="450"></canvas>

    <div id="controls">
      <select id="mode">
        <option value="0">Normal Function</option>
        <option value="1">1st Order ODE</option>
        <option value="2">2nd Order ODE</option>
      </select>

      <select id="level-select">
        <option value="">Freeplay (no restrictions)</option>
      </select>

      <span id="func-label">y =</span>
      <input id="function-input" type="text" placeholder="e.g. (x^2)/50" value="(x^2)/50" />

      <span class="angle-controls" id="angle-controls">
        <button id="angle-down">&darr;</button>
        <span id="angle-value">0&deg;</span>
        <button id="angle-up">&uarr;</button>
      </span>

      <button id="fire">Fire</button>
      <button id="new-match">New Match</button>
    </div>

    <div id="status"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
