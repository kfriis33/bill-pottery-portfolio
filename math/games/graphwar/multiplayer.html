<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Graphwar web prototype — Multiplayer</title>
    <style>
      body {
        background: #1b1f24;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px;
      }
      canvas {
        background: #ffffff;
        border: 1px solid #444;
      }
      section {
        display: none;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 770px;
      }
      section.visible {
        display: flex;
      }
      input,
      select {
        font-family: monospace;
        font-size: 14px;
        padding: 6px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #status {
        min-height: 1.2em;
        max-width: 770px;
      }
      #status.error {
        color: #ff6b6b;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #333;
      }
      .angle-controls {
        display: none;
        gap: 4px;
        align-items: center;
      }
      .angle-controls.visible {
        display: flex;
      }
      #chat-log {
        height: 100px;
        overflow-y: auto;
        background: #12151a;
        border: 1px solid #333;
        padding: 6px;
        font-size: 13px;
      }
      .back-button {
        background: none;
        border: 1px solid #444;
        color: #aaa;
        align-self: flex-start;
      }
      .tab-button {
        background: none;
        border: 1px solid #444;
        color: #aaa;
      }
      .tab-button.active {
        background: #2a3f66;
        border-color: #3468c0;
        color: #e6e6e6;
      }
      #teacher-game-status {
        min-height: 1.2em;
      }
      #countdown-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 12, 16, 0.92);
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #countdown-overlay.visible {
        display: flex;
      }
      #countdown-number {
        font-size: 30vh;
        font-weight: 900;
        line-height: 1;
        color: #f2c200;
      }
      #countdown-teammate {
        font-size: 1.4rem;
        color: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <h1 style="margin: 0; font-size: 1.1rem">Graphwar web prototype — Multiplayer</h1>

    <section id="landing-view" class="visible">
      <div class="row">
        <button id="landing-public">Join a Public Lobby</button>
        <button id="landing-classroom">Join a Classroom</button>
        <button id="landing-teacher">Lead a Classroom</button>
      </div>
    </section>

    <section id="teacher-password-view">
      <button class="back-button" id="back-from-teacher-password">&larr; Back</button>
      <h2 style="margin: 0; font-size: 1rem">Teacher sign-in</h2>
      <div class="row">
        <label for="teacher-password-input">Password</label>
        <input id="teacher-password-input" type="password" />
        <button id="teacher-password-submit">Continue</button>
      </div>
    </section>

    <section id="classroom-select-view">
      <button class="back-button" id="back-from-classroom-select">&larr; Back</button>
      <h2 style="margin: 0; font-size: 1rem">Choose your classroom</h2>
      <div class="row" id="classroom-buttons"></div>
    </section>

    <section id="connect-view">
      <button class="back-button" id="back-from-connect">&larr; Back</button>
      <div class="row">
        <label for="bridge-url">Bridge URL</label>
        <input id="bridge-url" type="text" value="wss://ws.williamkuenne.art" />
      </div>
      <div class="row">
        <label for="name-input">Name</label>
        <input id="name-input" type="text" placeholder="your name" value="Player" />
        <button id="connect-button">Connect</button>
      </div>
    </section>

    <section id="lobby-view">
      <button class="back-button" id="back-from-lobby">&larr; Back</button>
      <h2 style="margin: 0; font-size: 1rem">Rooms</h2>
      <table id="room-table">
        <thead>
          <tr>
            <th>Room</th>
            <th>Players</th>
            <th>Mode</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="room-table-body"></tbody>
      </table>
    </section>

    <section id="pregame-view">
      <button class="back-button" id="back-from-pregame">&larr; Back</button>
      <h2 style="margin: 0; font-size: 1rem">Pre-game</h2>
      <table id="player-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Team</th>
            <th>Soldiers</th>
            <th>Ready</th>
          </tr>
        </thead>
        <tbody id="player-table-body"></tbody>
      </table>
      <div class="row">
        <button id="switch-team">Switch Team</button>
        <button id="add-soldier">+ Soldier</button>
        <button id="remove-soldier">- Soldier</button>
        <label><input id="ready-checkbox" type="checkbox" /> Ready</label>
      </div>
      <div class="row" id="level-row">
        <label for="level-select">Level</label>
        <select id="level-select">
          <option value="">Freeplay (no restrictions)</option>
        </select>
      </div>
      <div class="row" id="classroom-level-row" style="display: none">
        <label>Classroom rules</label>
        <span id="classroom-level-label"></span>
      </div>
      <div id="chat-log"></div>
      <div class="row">
        <input id="chat-input" type="text" placeholder="chat..." style="flex: 1" />
        <button id="chat-send">Send</button>
      </div>
    </section>

    <section id="waiting-view">
      <button class="back-button" id="back-from-waiting">&larr; Back</button>
      <h2 style="margin: 0; font-size: 1rem">Classroom waiting room</h2>
      <div id="waiting-status"></div>

      <div class="row">
        <label for="soldier-skin-select">Soldier skin</label>
        <select id="soldier-skin-select"></select>
        <label for="artillery-skin-select">Artillery skin</label>
        <select id="artillery-skin-select"></select>
      </div>

      <h3 style="margin: 8px 0 0; font-size: 0.95rem">Leaderboard</h3>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Kills</th>
            <th>Deaths</th>
            <th>K/D</th>
            <th>Wins</th>
          </tr>
        </thead>
        <tbody id="leaderboard-table-body"></tbody>
      </table>
    </section>

    <section id="teacher-view">
      <button class="back-button" id="back-from-teacher">&larr; Back</button>
      <h2 style="margin: 0; font-size: 1rem" id="teacher-classroom-label"></h2>
      <div class="row">
        <button id="teacher-tab-game" class="tab-button active">Live Game</button>
        <button id="teacher-tab-leaderboard" class="tab-button">Leaderboard</button>
      </div>

      <div id="teacher-game-panel">
        <div id="teacher-game-status">Waiting for the next game to start...</div>
        <canvas id="teacher-plane" width="770" height="450"></canvas>
      </div>

      <div id="teacher-leaderboard-panel" style="display: none">
        <table id="teacher-leaderboard-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>Kills</th>
              <th>Deaths</th>
              <th>K/D</th>
              <th>Wins</th>
            </tr>
          </thead>
          <tbody id="teacher-leaderboard-table-body"></tbody>
        </table>
      </div>
    </section>

    <section id="game-view">
      <canvas id="plane" width="770" height="450"></canvas>
      <div class="row">
        <span id="func-label">y =</span>
        <input id="function-input" type="text" placeholder="e.g. (x^2)/50" style="flex: 1" />
        <span class="angle-controls" id="angle-controls">
          <button id="angle-down">&darr;</button>
          <span id="angle-value">0&deg;</span>
          <button id="angle-up">&uarr;</button>
        </span>
        <button id="fire">Fire</button>
      </div>
    </section>

    <div id="status"></div>

    <div id="countdown-overlay">
      <div id="countdown-number"></div>
      <div id="countdown-teammate"></div>
    </div>

    <script type="module" src="./src/multiplayer.js"></script>
  </body>
</html>
